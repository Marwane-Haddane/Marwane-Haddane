const wall=document.getElementById('wall'),view=document.getElementById('viewer');let lastFocus;

function resume(){if(!raf&&!calm.matches&&fine.matches&&!document.hidden)raf=requestAnimationFrame(tick)}
addEventListener('pointermove',e=>{tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1;resume()});document.addEventListener('pointerleave',()=>{tx=0;ty=0;resume()});document.addEventListener('visibilitychange',resume);calm.addEventListener('change',()=>{if(calm.matches){wall.style.transform='none';cards.forEach(c=>c.style.transform='none')}else resume()});resume();
